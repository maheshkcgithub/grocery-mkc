<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grocery Till</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: till-style split — product shelf on the left, receipt on the right; stacks on phones */
:root {
  --bg: #f3f6f2; --surface: #ffffff; --fg: #1b2a20; --muted: #5d6d62;
  --line: #d9e2da; --accent: #2f7d4a; --accent-fg: #ffffff; --warn: #b4531a; --chip: #e6efe7;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121a15; --surface: #1a241e; --fg: #e3ece5; --muted: #98a99d;
  --line: #2c3a31; --accent: #5cb87a; --accent-fg: #0d1a11; --warn: #e89a63; --chip: #223029; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121a15; --surface: #1a241e; --fg: #e3ece5; --muted: #98a99d;
  --line: #2c3a31; --accent: #5cb87a; --accent-fg: #0d1a11; --warn: #e89a63; --chip: #223029; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 40px }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 20px }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance }
h1 { font-size: 1.9rem; letter-spacing: -0.01em }
h2 { font-size: 1.1rem }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px }
header p { margin: 0; color: var(--muted) }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr) } }
section { display: grid; gap: 14px; min-width: 0 }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px }
label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display: grid; gap: 4px }
input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100% }
.form { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.6fr) auto; gap: 10px; align-items: end }
.form input[type="file"] { font-size: 0.8rem; padding: 6px }
@media (max-width: 620px) { .form { grid-template-columns: 1fr 1fr } .form label:first-child, .form label:nth-child(4) { grid-column: 1 / -1 } }
button { font: inherit; font-weight: 600; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 14px }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }
button:disabled { opacity: 0.45; cursor: not-allowed }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.err { color: var(--warn); font-size: 0.85rem; margin: 0 }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px }
.item { position: relative; text-align: left; display: grid; gap: 2px; padding: 10px; border-radius: 8px; font-weight: 400; align-content: start }
.pic { display: grid; place-items: center; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 6px; background: var(--chip); overflow: hidden; font-size: 2.6rem; margin-bottom: 6px }
.pic img { width: 100%; height: 100%; object-fit: cover; display: block }
.item .photo { font-size: 0.75rem; color: var(--accent); font-weight: 600; margin-top: 2px }
.item .photo:hover { text-decoration: underline }
.item:hover:not(:disabled) { border-color: var(--accent) }
.item .name { font-weight: 600 }
.item .price { font-family: var(--mono); font-variant-numeric: tabular-nums }
.item .stock { font-size: 0.8rem; color: var(--muted) }
.item .stock.low { color: var(--warn) }
.item .del { position: absolute; top: 14px; right: 14px; background: var(--surface); color: var(--muted); border-radius: 999px; padding: 0 8px; font-size: 1rem; line-height: 1.5 }
.receipt { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.9rem }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line) }
.line span:first-child { overflow-wrap: anywhere }
.qty { display: flex; align-items: center; gap: 4px }
.qty button { padding: 0 8px; line-height: 1.6 }
.total { display: flex; justify-content: space-between; font-family: var(--display); font-size: 1.4rem; font-weight: 700 }
.empty { color: var(--muted); margin: 0 }
.sales { margin: 0; padding: 0; list-style: none; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.85rem; display: grid; gap: 4px; max-height: 220px; overflow: auto }
.sales li { display: flex; justify-content: space-between; gap: 8px; color: var(--muted) }
.sales li b { color: var(--fg); font-weight: 500 }
.note { background: var(--chip); border-radius: 6px; padding: 8px 12px; font-size: 0.85rem; margin: 0 }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600 }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Grocery Till</h1>
    <p id="today"></p>
  </header>

  <div class="grid">
    <section>
      <form class="panel form" id="addForm" novalidate>
        <label>Product <input id="pName" placeholder="e.g. Mjölk 3%" autocomplete="off"></label>
        <label>Price (kr) <input id="pPrice" inputmode="decimal" placeholder="17.90"></label>
        <label>Stock <input id="pStock" inputmode="numeric" placeholder="20"></label>
        <label>Photo (optional) <input id="pImg" type="file" accept="image/*"></label>
        <button class="primary" type="submit">Add product</button>
      </form>
      <p class="err" id="formErr" hidden></p>
      <h2>Products <span class="stock" style="font-family:var(--body);font-weight:400;color:var(--muted);font-size:0.85rem">· tap to add to cart</span></h2>
      <div class="shelf" id="shelf"></div>
    </section>

    <aside class="panel">
      <h2>Cart</h2>
      <div class="receipt" id="cart"></div>
      <div class="total"><span>Total</span><span id="total">0.00 kr</span></div>
      <button class="primary" id="checkout">Checkout</button>
      <h2>Today's sales</h2>
      <ul class="sales" id="sales"></ul>
      <p class="note">Products and sales are saved in this browser only.</p>
    </aside>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" accept="image/*" id="photoPick" hidden>

<script>
const KEY = "grocery-till-v1";
const SAMPLE = { nextId: 6, sales: [], products: [
  { id: 1, name: "Mjölk 3% 1 l", price: 17.9, stock: 24, img: "🥛" },
  { id: 2, name: "Bread loaf", price: 32.5, stock: 8, img: "🍞" },
  { id: 3, name: "Bananas 1 kg", price: 24.9, stock: 15, img: "🍌" },
  { id: 4, name: "Eggs 12-pack", price: 49.0, stock: 3, img: "🥚" },
  { id: 5, name: "Coffee 450 g", price: 69.9, stock: 10, img: "☕" },
]};
let db; try { db = JSON.parse(localStorage.getItem(KEY)) } catch {}
if (!db) db = structuredClone(SAMPLE);
// Older saves have no pictures: give the example products theirs back
db.products.forEach(p => { if (p.img === undefined) { const s = SAMPLE.products.find(x => x.id === p.id && x.name === p.name); p.img = s ? s.img : "" } });
const cart = new Map(); // product id -> qty
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); return true } catch { return false } };

// Shrink a photo to a small square JPEG so many fit in browser storage
function shrink(file) {
  return new Promise(res => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const s = 240, c = document.createElement("canvas"); c.width = c.height = s;
      const r = Math.max(s / im.width, s / im.height), w = im.width * r, h = im.height * r;
      c.getContext("2d").drawImage(im, (s - w) / 2, (s - h) / 2, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.8));
    };
    im.onerror = () => { URL.revokeObjectURL(url); res("") };
    im.src = url;
  });
}
const kr = n => n.toFixed(2) + " kr";
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const byId = id => db.products.find(p => p.id === id);

function render() {
  $("shelf").innerHTML = db.products.length ? db.products.map(p => {
    const left = p.stock - (cart.get(p.id) || 0);
    const pic = p.img && p.img.startsWith("data:image/") ? `<img src="${p.img}" alt="">` : esc(p.img || "🛒");
    return `<button class="item" data-id="${p.id}" ${left <= 0 ? "disabled" : ""}>
      <span class="pic">${pic}</span>
      <span class="name">${esc(p.name)}</span>
      <span class="price">${kr(p.price)}</span>
      <span class="stock ${left <= 3 ? "low" : ""}">${left <= 0 ? "Out of stock" : left + " in stock"}</span>
      <span class="photo" role="button" data-photo="${p.id}">Change photo</span>
      <span class="del" role="button" aria-label="Remove ${esc(p.name)}" data-del="${p.id}">×</span>
    </button>`;
  }).join("") : `<p class="empty">No products yet. Add one above.</p>`;

  let total = 0;
  $("cart").innerHTML = cart.size ? [...cart].map(([id, q]) => {
    const p = byId(id); total += p.price * q;
    return `<div class="line"><span>${esc(p.name)}</span>
      <span class="qty"><button data-dec="${id}" aria-label="One less">−</button>${q}<button data-inc="${id}" aria-label="One more" ${q >= p.stock ? "disabled" : ""}>+</button></span>
      <span>${kr(p.price * q)}</span></div>`;
  }).join("") : `<p class="empty">Cart is empty.</p>`;
  $("total").textContent = kr(total);
  $("checkout").disabled = !cart.size;

  const today = new Date().toDateString();
  const todays = db.sales.filter(s => new Date(s.at).toDateString() === today);
  const sum = todays.reduce((a, s) => a + s.total, 0);
  $("today").textContent = `${todays.length} sale${todays.length === 1 ? "" : "s"} today · ${kr(sum)}`;
  $("sales").innerHTML = todays.length ? todays.slice().reverse().map(s =>
    `<li><span>${new Date(s.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })} · ${s.items} item${s.items === 1 ? "" : "s"}</span><b>${kr(s.total)}</b></li>`
  ).join("") : `<li>No sales yet today.</li>`;
}

let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2200) }

$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target;
  const name = $("pName").value.trim(), price = parseFloat($("pPrice").value.replace(",", ".")), stock = parseInt($("pStock").value, 10);
  const err = !name ? "Enter a product name." : !(price >= 0) ? "Enter a price, like 17.90." : !(stock >= 0) ? "Enter stock as a whole number." : "";
  $("formErr").textContent = err; $("formErr").hidden = !err;
  if (err) return;
  const file = $("pImg").files[0];
  const img = file ? await shrink(file) : "";
  db.products.push({ id: db.nextId++, name, price, stock, img });
  const saved = save(); form.reset(); $("pName").focus(); render();
  toast(saved ? `Added ${name}` : "Added, but this browser's storage is full. Try a smaller photo.");
});

let photoFor = null;
$("photoPick").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file || photoFor == null) return;
  const img = await shrink(file);
  if (!img) return toast("That file isn't a picture. Choose a JPG or PNG.");
  byId(photoFor).img = img; render();
  toast(save() ? "Photo updated" : "Photo shown, but this browser's storage is full so it won't be kept.");
});

$("shelf").addEventListener("click", e => {
  const ph = e.target.closest("[data-photo]");
  if (ph) { photoFor = +ph.dataset.photo; $("photoPick").click(); return }
  const del = e.target.closest("[data-del]");
  if (del) { const id = +del.dataset.del; db.products = db.products.filter(p => p.id !== id); cart.delete(id); save(); render(); return }
  const item = e.target.closest(".item"); if (!item) return;
  const id = +item.dataset.id; cart.set(id, (cart.get(id) || 0) + 1); render();
});

$("cart").addEventListener("click", e => {
  const inc = e.target.closest("[data-inc]"), dec = e.target.closest("[data-dec]");
  if (inc) { const id = +inc.dataset.inc; cart.set(id, cart.get(id) + 1) }
  if (dec) { const id = +dec.dataset.dec, q = cart.get(id) - 1; q ? cart.set(id, q) : cart.delete(id) }
  render();
});

$("checkout").addEventListener("click", () => {
  let total = 0, items = 0;
  for (const [id, q] of cart) { const p = byId(id); p.stock -= q; total += p.price * q; items += q }
  db.sales.push({ at: Date.now(), total: Math.round(total * 100) / 100, items });
  cart.clear(); save(); render(); toast(`Sale complete: ${kr(total)}`);
});

render();
</script>
</body>
</html>
