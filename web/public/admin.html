<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MKC Grocery Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line) }
.tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 8px 14px; color: var(--muted) }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent) }
.form { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.6fr) auto; gap: 10px; align-items: end }
@media (max-width: 860px) { .form { grid-template-columns: 1fr 1fr } .form label:nth-child(2), .form label:nth-child(5) { grid-column: 1 / -1 } }
.scroll { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem }
th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500 }
th, td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: middle }
td input { width: 90px; padding: 4px 6px }
td input.name { width: 100%; min-width: 140px }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px }
@media (max-width: 560px) { .stats { grid-template-columns: 1fr } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px }
.stat b { display: block; font-family: var(--display); font-size: 1.6rem }
.stat span { font-size: 0.8rem; color: var(--muted) }
.status { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; background: var(--chip) }
.status.new { background: var(--accent); color: var(--accent-fg) }
.status.cancelled { color: var(--warn) }
td select { width: auto; padding: 4px 6px }
.actions { display: grid; gap: 4px; justify-items: start }
.items { margin: 0; padding-left: 16px }
.stack { display: grid; gap: 14px; min-width: 0 }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MKC Grocery Admin</h1>
    <a href="./" target="_blank" rel="noopener">Open the shop ↗</a>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tabProducts" aria-selected="true">Products</button>
    <button role="tab" id="tabSales" aria-selected="false">Sales</button>
  </nav>

  <!-- PRODUCTS -->
  <section id="products" class="stack">
    <form class="panel form" id="addForm" novalidate>
      <label>Section <select id="pCat"></select></label>
      <label>Product <input id="pName" placeholder="e.g. Mjölk 3% 1 l" autocomplete="off"></label>
      <label>Price (kr) <input id="pPrice" inputmode="decimal" placeholder="17.90"></label>
      <label>Stock <input id="pStock" inputmode="numeric" placeholder="20"></label>
      <label>Photo (optional) <input id="pImg" type="file" accept="image/*"></label>
      <button class="primary" type="submit">Add product</button>
    </form>
    <p class="err" id="formErr" hidden></p>
    <div class="panel scroll">
      <table>
        <thead><tr><th>Photo</th><th>Section</th><th>Product</th><th>Price (kr)</th><th>Stock</th><th></th></tr></thead>
        <tbody id="productRows"></tbody>
      </table>
    </div>
  </section>

  <!-- SALES -->
  <section id="sales" class="stack" hidden>
    <div class="stats">
      <div class="stat"><span>Sales today</span><b class="money" id="sToday">0.00 kr</b></div>
      <div class="stat"><span>Orders today</span><b id="sCount">0</b></div>
      <div class="stat"><span>Waiting for delivery</span><b id="sNew">0</b></div>
    </div>
    <div class="panel scroll">
      <table>
        <thead><tr><th>#</th><th>Time</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead>
        <tbody id="orderRows"></tbody>
      </table>
    </div>
  </section>
</div>
<input type="file" accept="image/*" id="photoPick" hidden>
<div class="toast" id="toast" hidden></div>

<script>
const $ = id => document.getElementById(id);
const kr = n => n.toFixed(2) + " kr";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const picHtml = img => !img ? `<img src="img/cart.webp" alt="">`
  : img.startsWith("data:image/") || img.startsWith("img/") ? `<img src="${esc(img)}" alt="" loading="lazy">` : esc(img);
let categories = [];
const catOptions = sel => categories.map(c => `<option ${c === sel ? "selected" : ""}>${esc(c)}</option>`).join("");
let toastTimer;
const toast = (msg, ms = 2500) => { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, ms) };

async function api(path, method = "GET", body) {
  const res = await fetch("api/" + path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body && JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Something went wrong. Refresh and try again.");
  return data;
}

// Shrink a photo to a small square JPEG before saving
function shrink(file) {
  return new Promise(res => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const s = 320, c = document.createElement("canvas"); c.width = c.height = s;
      const r = Math.max(s / im.width, s / im.height), w = im.width * r, h = im.height * r;
      c.getContext("2d").drawImage(im, (s - w) / 2, (s - h) / 2, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.8));
    };
    im.onerror = () => { URL.revokeObjectURL(url); res("") };
    im.src = url;
  });
}

// ---- Tabs ----
function show(tab) {
  $("tabProducts").setAttribute("aria-selected", tab === "products");
  $("tabSales").setAttribute("aria-selected", tab === "sales");
  $("products").hidden = tab !== "products"; $("sales").hidden = tab !== "sales";
  tab === "sales" ? loadOrders() : loadProducts();
}
$("tabProducts").onclick = () => show("products");
$("tabSales").onclick = () => show("sales");

// ---- Products ----
let products = [];
async function loadProducts() {
  if (!categories.length) { categories = await api("categories"); $("pCat").innerHTML = catOptions(categories[0]) }
  products = (await api("products")).sort((a, b) => categories.indexOf(a.category) - categories.indexOf(b.category) || a.name.localeCompare(b.name));
  $("productRows").innerHTML = products.length ? products.map(p => `<tr data-id="${p.id}">
    <td><span class="pic small">${picHtml(p.image)}</span><button class="link" data-photo>Change</button></td>
    <td><select data-field="category" aria-label="Section">${catOptions(p.category)}</select></td>
    <td><input class="name" value="${esc(p.name)}" data-field="name" aria-label="Name"></td>
    <td><input value="${p.price.toFixed(2)}" inputmode="decimal" data-field="price" aria-label="Price"></td>
    <td><input value="${p.stock}" inputmode="numeric" data-field="stock" aria-label="Stock" class="${p.stock <= 3 ? "low" : ""}"></td>
    <td><button class="link danger" data-del>Remove</button></td>
  </tr>`).join("") : `<tr><td colspan="6" class="empty">No products yet. Add your first one above.</td></tr>`;
}

function readForm(name, price, stock) {
  price = parseFloat(String(price).replace(",", ".")); stock = Number(stock);
  if (!name.trim()) return "Enter a product name.";
  if (!(price >= 0)) return "Enter a price, like 17.90.";
  if (!Number.isInteger(stock) || stock < 0 || String(stock) === "") return "Enter stock as a whole number.";
  return { name: name.trim(), price, stock };
}

$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const p = readForm($("pName").value, $("pPrice").value, $("pStock").value.trim() === "" ? NaN : $("pStock").value);
  $("formErr").hidden = typeof p !== "string"; $("formErr").textContent = typeof p === "string" ? p : "";
  if (typeof p === "string") return;
  const file = $("pImg").files[0];
  p.image = file ? await shrink(file) : "";
  p.category = $("pCat").value;
  try { await api("admin/products", "POST", p); e.target.reset(); $("pCat").value = p.category; toast(`Added ${p.name} to ${p.category}`); loadProducts() }
  catch (err) { toast(err.message) }
});

// Save a row when you leave an edited field
$("productRows").addEventListener("change", async e => {
  const row = e.target.closest("tr"); if (!row || !e.target.dataset.field) return;
  const cur = products.find(p => p.id === +row.dataset.id);
  const val = f => row.querySelector(`[data-field="${f}"]`).value;
  const p = readForm(val("name"), val("price"), val("stock").trim() === "" ? NaN : val("stock"));
  if (typeof p === "string") { toast(p); return loadProducts() }
  try { await api("admin/products/" + cur.id, "PUT", { ...p, category: val("category"), image: cur.image }); toast(`Saved ${p.name}`); loadProducts() }
  catch (err) { toast(err.message) }
});

let photoFor = null;
$("productRows").addEventListener("click", async e => {
  const row = e.target.closest("tr"); if (!row) return;
  const p = products.find(x => x.id === +row.dataset.id);
  if (e.target.closest("[data-photo]")) { photoFor = p; $("photoPick").click() }
  if (e.target.closest("[data-del]")) {
    const b = e.target.closest("[data-del]");
    if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Click again to remove"; return }
    try { await api("admin/products/" + p.id, "DELETE"); toast(`Removed ${p.name}`); loadProducts() } catch (err) { toast(err.message) }
  }
});
$("photoPick").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file || !photoFor) return;
  const image = await shrink(file);
  if (!image) return toast("That file isn't a picture. Choose a JPG or PNG.");
  const { id, name, price, stock, category } = photoFor;
  try { await api("admin/products/" + id, "PUT", { name, price, stock, category, image }); toast("Photo updated"); loadProducts() } catch (err) { toast(err.message) }
});

// ---- Sales ----
const when = s => new Date(s.replace(" ", "T") + "Z");
async function loadOrders() {
  const orders = await api("admin/orders");
  const today = new Date().toDateString();
  const todays = orders.filter(o => when(o.created).toDateString() === today && o.status !== "cancelled");
  $("sToday").textContent = kr(todays.reduce((a, o) => a + o.total, 0));
  $("sCount").textContent = todays.length;
  $("sNew").textContent = orders.filter(o => o.status === "new").length;
  $("orderRows").innerHTML = orders.length ? orders.map(o => `<tr data-id="${o.id}">
    <td>${o.id}</td>
    <td class="money">${when(o.created).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })}</td>
    <td><b>${esc(o.customer)}</b><br><span class="muted">${esc(o.phone)}<br>${o.email ? esc(o.email) + "<br>" : ""}${esc(o.address)}</span></td>
    <td><ul class="items">${o.items.map(i => `<li>${esc(i.name)} × ${i.qty}</li>`).join("")}</ul></td>
    <td class="money">${kr(o.total)}</td>
    <td><div class="actions"><span class="status ${o.status}">${o.status}</span>
      ${o.status === "new" ? `<button class="link" data-set="delivered">Mark delivered</button>` : ""}
      ${o.status === "delivered" ? `<button class="link" data-set="new">Mark not delivered</button>` : ""}
      ${o.status !== "cancelled" ? `<button class="link danger" data-set="cancelled">Cancel order</button>` : `<button class="link" data-set="new">Restore order</button>`}
    </div></td>
  </tr>`).join("") : `<tr><td colspan="6" class="empty">No orders yet. They appear here as soon as a customer orders.</td></tr>`;
}
$("orderRows").addEventListener("click", async e => {
  const b = e.target.closest("[data-set]"); if (!b) return;
  const row = b.closest("tr"), id = row.dataset.id, status = b.dataset.set;
  // Cancelling asks for a second click so it can't happen by accident
  if (status === "cancelled" && b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Click again to cancel"; return }
  try {
    const result = await api("admin/orders/" + id, "PATCH", { status });
    const name = row.querySelector("b").textContent, phone = row.querySelector(".muted").firstChild.textContent;
    toast(status === "cancelled" ? (result.emailed
      ? `Order #${id} cancelled. Items are back in stock. ${name} has been emailed.`
      : `Order #${id} cancelled. Items are back in stock. No email was sent, so call or text ${name} on ${phone} to let them know.`)
      : status === "delivered" ? `Order #${id} marked delivered` : `Order #${id} is open again`, status === "cancelled" ? 8000 : 2500);
  } catch (err) { toast(err.message, 5000) }
  loadOrders();
});
setInterval(() => { if (!$("sales").hidden) loadOrders() }, 30000);

loadProducts();
</script>
</body>
</html>
